name: Hero Test Environment

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Candidate SemVer to verify in the test environment"
        required: true
        type: string
      artifact_digest:
        description: "Immutable GHCR artifact digest from the release manifest"
        required: true
        type: string
      commit_sha:
        description: "Commit SHA from the release manifest"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: hero-test-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  verify-test:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate and pull the immutable candidate artifact
        env:
          ARTIFACT: ${{ inputs.artifact_digest }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          node --input-type=module -e '
            const artifact = process.env.ARTIFACT ?? "";
            if (!/^ghcr\.io\/farhaddgm\/hero@sha256:[a-f0-9]{64}$/.test(artifact)) process.exit(1);
            const commit = process.env.COMMIT_SHA ?? "";
            if (!/^[0-9a-f]{7,64}$/i.test(commit)) process.exit(1);
            const version = process.env.RELEASE_VERSION ?? "";
            if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) process.exit(1);
          '
          docker pull "$ARTIFACT"
          IMAGE_VERSION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.version"}}' "$ARTIFACT")"
          IMAGE_REVISION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ARTIFACT")"
          [[ "$IMAGE_VERSION" == "$RELEASE_VERSION" ]] || { echo "Artifact version label does not match release_version." >&2; exit 1; }
          [[ "$IMAGE_REVISION" == "$COMMIT_SHA" ]] || { echo "Artifact revision label does not match commit_sha." >&2; exit 1; }
      - name: Record test candidate identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          ARTIFACT: ${{ inputs.artifact_digest }}
        run: |
          IMAGE_ID="$(docker image inspect --format='{{.Id}}' "$ARTIFACT")"
          printf 'release_version=%s\ncommit_sha=%s\nartifact=%s\nartifact_id=%s\n' \
            "$RELEASE_VERSION" "$COMMIT_SHA" "$ARTIFACT" "$IMAGE_ID" > hero-test-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hero-test-evidence-${{ github.sha }}
          path: hero-test-evidence.txt
