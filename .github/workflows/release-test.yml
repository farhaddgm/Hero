name: Hero Test Environment

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Candidate SemVer to verify in the test environment"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: hero-test-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  verify-test:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the immutable candidate artifact
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_REF="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):$COMMIT_SHA"
          docker pull "$IMAGE_REF"
      - name: Record test candidate identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_REF="$(printf 'ghcr.io/%s:%s' "$GITHUB_REPOSITORY" "$COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          ARTIFACT="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")"
          IMAGE_ID="$(docker image inspect --format='{{.Id}}' "$IMAGE_REF")"
          printf 'release_version=%s\ncommit_sha=%s\nartifact=%s\nartifact_id=%s\n' \
            "$RELEASE_VERSION" "$COMMIT_SHA" "$ARTIFACT" "$IMAGE_ID" > hero-test-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hero-test-evidence-${{ github.sha }}
          path: hero-test-evidence.txt
