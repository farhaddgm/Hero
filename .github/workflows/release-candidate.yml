name: Hero Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Candidate SemVer, for example 0.1.0-rc.1"
        required: true
        type: string
      release_notes:
        description: "Optional owner-facing notes for the candidate"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: hero-release-candidate-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Verify, tag and publish test candidate
    runs-on: ubuntu-latest
    environment:
      name: test
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_NOTES: ${{ inputs.release_notes || format('Test candidate for commit {0}.', github.sha) }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Validate candidate version
        run: |
          node --input-type=module -e '
            const version = process.env.RELEASE_VERSION ?? "";
            const semver = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            if (!semver.test(version)) {
              console.error(`Invalid candidate SemVer: ${version}`);
              process.exit(1);
            }
          '

      - name: Run release preflight
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node tools/release-preflight.mjs --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --environment test --skip-remote

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Hero verification
        run: pnpm check

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable test artifact
        id: image
        run: |
          IMAGE_REF="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):$GITHUB_SHA"
          docker build --tag "$IMAGE_REF" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker push "$IMAGE_REF"
          ARTIFACT="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")"
          ARTIFACT_ID="$(docker image inspect --format='{{.Id}}' "$IMAGE_REF")"
          mkdir -p dist/release
          printf 'release_version=%s\ncommit_sha=%s\nartifact=%s\nartifact_id=%s\n' \
            "$RELEASE_VERSION" "$GITHUB_SHA" "$ARTIFACT" "$ARTIFACT_ID" > dist/release/hero-release-evidence.txt
          printf 'artifact=%s\n' "$ARTIFACT" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}

      - name: Create immutable release manifest
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ARTIFACT: ${{ steps.image.outputs.artifact }}
        run: |
          node tools/create-release-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --artifact "$ARTIFACT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output dist/release/hero-release-manifest.json

      - name: Create exact version tag
        run: |
          TAG="v${RELEASE_VERSION}"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; choose a new candidate version."
            exit 1
          fi
          git config user.name "hero-release-bot"
          git config user.email "hero-release-bot@users.noreply.github.com"
          git tag --annotate "$TAG" "$GITHUB_SHA" --message "Hero $TAG"
          git push origin "$TAG"

      - name: Create GitHub pre-release
        id: github-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            const notes = process.env.RELEASE_NOTES?.trim() || `Test candidate for ${tag}.`;
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Hero ${tag} — test candidate`,
              body: `${notes}\n\nCommit: ${context.sha}\nEnvironment: test\nProduction deploy: not performed`,
              draft: false,
              prerelease: true,
              generate_release_notes: false
            });
            core.setOutput("url", release.data.html_url);

      - name: Complete release evidence
        env:
          RELEASE_URL: ${{ steps.github-release.outputs.url }}
        run: |
          printf 'release_url=%s\n' "$RELEASE_URL" >> dist/release/hero-release-evidence.txt
          {
            echo "### Hero test candidate"
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Release: ${RELEASE_URL}"
            echo "- Artifact: \`${{ steps.image.outputs.artifact }}\`"
            echo "- Production deploy: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize immutable release manifest
        run: cat dist/release/hero-release-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: hero-release-evidence-${{ inputs.release_version }}-${{ github.sha }}
          path: |
            dist/release/hero-release-evidence.txt
            dist/release/hero-release-manifest.json
          if-no-files-found: error
