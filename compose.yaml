services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HERO_HTTP_HOST: 0.0.0.0
      HERO_HTTP_PORT: 3100
      HERO_DATA_DIR: /var/lib/hero
      HERO_LOG_LEVEL: ${HERO_LOG_LEVEL:-info}
    ports:
      - "${HERO_BIND_ADDRESS:-127.0.0.1}:${HERO_EXPOSE_PORT:-43100}:3100"
    volumes:
      - hero-data:/var/lib/hero
    networks:
      - hero-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  hero-data:

networks:
  hero-private:
    driver: bridge
