services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HERO_HTTP_HOST: 0.0.0.0
      HERO_HTTP_PORT: 3100
      HERO_DATA_DIR: /var/lib/hero
      HERO_LOG_LEVEL: ${HERO_LOG_LEVEL:-info}
      HERO_OWNER_AUTH_SECRET: ${HERO_OWNER_AUTH_SECRET:-}
      HERO_ADMIN_AUTH_SECRET: ${HERO_ADMIN_AUTH_SECRET:-}
      HERO_BACKOFFICE_USER: ${HERO_BACKOFFICE_USER:-}
      HERO_BACKOFFICE_PASSWORD: ${HERO_BACKOFFICE_PASSWORD:-}
      HERO_POSTGRES_URL: ${HERO_POSTGRES_URL:-}
      HERO_POSTGRES_PASSWORD: ${HERO_POSTGRES_PASSWORD:-}
      HERO_REQUIRE_POSTGRES: ${HERO_REQUIRE_POSTGRES:-false}
      HERO_ENABLE_REAL_PROVIDERS: ${HERO_ENABLE_REAL_PROVIDERS:-false}
      HERO_OPENAI_API_KEY: ${HERO_OPENAI_API_KEY:-}
      HERO_ANTHROPIC_API_KEY: ${HERO_ANTHROPIC_API_KEY:-}
      HERO_GOOGLE_API_KEY: ${HERO_GOOGLE_API_KEY:-}
      HERO_OPENAI_COMPATIBLE_API_KEY: ${HERO_OPENAI_COMPATIBLE_API_KEY:-}
      HERO_OPENAI_COST_UNITS_PER_1K_TOKENS: ${HERO_OPENAI_COST_UNITS_PER_1K_TOKENS:-}
      HERO_OPENAI_INPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_OPENAI_INPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_OPENAI_OUTPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_OPENAI_OUTPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_ANTHROPIC_COST_UNITS_PER_1K_TOKENS: ${HERO_ANTHROPIC_COST_UNITS_PER_1K_TOKENS:-}
      HERO_ANTHROPIC_INPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_ANTHROPIC_INPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_ANTHROPIC_OUTPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_ANTHROPIC_OUTPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_GOOGLE_COST_UNITS_PER_1K_TOKENS: ${HERO_GOOGLE_COST_UNITS_PER_1K_TOKENS:-}
      HERO_GOOGLE_INPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_GOOGLE_INPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_GOOGLE_OUTPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_GOOGLE_OUTPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_OPENAI_COMPATIBLE_COST_UNITS_PER_1K_TOKENS: ${HERO_OPENAI_COMPATIBLE_COST_UNITS_PER_1K_TOKENS:-}
      HERO_OPENAI_COMPATIBLE_INPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_OPENAI_COMPATIBLE_INPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_OPENAI_COMPATIBLE_OUTPUT_COST_UNITS_PER_1K_TOKENS: ${HERO_OPENAI_COMPATIBLE_OUTPUT_COST_UNITS_PER_1K_TOKENS:-}
      HERO_EXTERNAL_SPEND_AUTHORIZATION_ACTIVE: ${HERO_EXTERNAL_SPEND_AUTHORIZATION_ACTIVE:-false}
      HERO_EXTERNAL_SPEND_AUTHORIZATION_ID: ${HERO_EXTERNAL_SPEND_AUTHORIZATION_ID:-}
      HERO_EXTERNAL_SPEND_PROJECT_ID: ${HERO_EXTERNAL_SPEND_PROJECT_ID:-}
      HERO_EXTERNAL_SPEND_STEP_ID: ${HERO_EXTERNAL_SPEND_STEP_ID:-}
      HERO_EXTERNAL_SPEND_DOCUMENT_VERSION: ${HERO_EXTERNAL_SPEND_DOCUMENT_VERSION:-}
      HERO_EXTERNAL_SPEND_PROVIDER_ID: ${HERO_EXTERNAL_SPEND_PROVIDER_ID:-}
      HERO_EXTERNAL_SPEND_MODEL_IDS: ${HERO_EXTERNAL_SPEND_MODEL_IDS:-}
      HERO_EXTERNAL_SPEND_ROLE_IDS: ${HERO_EXTERNAL_SPEND_ROLE_IDS:-}
      HERO_EXTERNAL_SPEND_MAX_COST_UNITS: ${HERO_EXTERNAL_SPEND_MAX_COST_UNITS:-}
      HERO_EXTERNAL_SPEND_EXPIRES_AT: ${HERO_EXTERNAL_SPEND_EXPIRES_AT:-}
      HERO_EXTERNAL_SPEND_GLOBAL_STOP: ${HERO_EXTERNAL_SPEND_GLOBAL_STOP:-false}
    ports:
      - "${HERO_BIND_ADDRESS:-127.0.0.1}:${HERO_EXPOSE_PORT:-43100}:3100"
    volumes:
      - hero-data:/var/lib/hero
    networks:
      - hero-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  hero-postgres:
    profiles: ["postgres"]
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hero
      POSTGRES_USER: hero
      POSTGRES_PASSWORD: ${HERO_POSTGRES_PASSWORD:-}
    volumes:
      - hero-postgres-data:/var/lib/postgresql/data
    networks:
      - hero-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero -d hero"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Hero Test-only Caddy authentication sidecar
  backoffice-proxy:
    profiles: ["test-caddy-auth"]
    image: caddy@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    # The official Caddy binary carries cap_net_bind_service. Keep only
    # that capability in the bounding set so exec is permitted.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/hero/caddy-test/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    networks:
      hero-private:
        aliases:
          - hero-test-caddy-auth
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  hero-data:
  hero-postgres-data:

networks:
  hero-private:
    driver: bridge
