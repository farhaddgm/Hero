services:
  control-plane:
    image: ${HERO_IMAGE:-hero-control-plane:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HERO_HTTP_HOST: 0.0.0.0
      HERO_HTTP_PORT: 3100
      HERO_UI_ENVIRONMENT: ${HERO_UI_ENVIRONMENT:-}
      HERO_RELEASE_VERSION: ${HERO_RELEASE_VERSION:-}
      HERO_SOURCE_COMMIT: ${HERO_SOURCE_COMMIT:-}
      HERO_IMAGE_DIGEST: ${HERO_IMAGE_DIGEST:-}
      HERO_DATA_DIR: /var/lib/hero
      HERO_PRIVATE_OBJECT_STORE_ENABLED: ${HERO_PRIVATE_OBJECT_STORE_ENABLED:-true}
      HERO_OBJECT_STORE_DIR: /var/lib/hero/objects
      HERO_SECRET_STORE_ENABLED: ${HERO_SECRET_STORE_ENABLED:-false}
      HERO_SECRET_STORE_DIR: ${HERO_SECRET_STORE_DIR:-/var/lib/hero/secret-store}
      HERO_SECRET_STORE_MASTER_KEY: ${HERO_SECRET_STORE_MASTER_KEY:-}
      HERO_LOG_LEVEL: ${HERO_LOG_LEVEL:-info}
      HERO_OWNER_AUTH_SECRET: ${HERO_OWNER_AUTH_SECRET:-}
      HERO_ADMIN_AUTH_SECRET: ${HERO_ADMIN_AUTH_SECRET:-}
      HERO_IDENTITY_SESSION_SECRET: ${HERO_IDENTITY_SESSION_SECRET:-}
      HERO_MFA_ENCRYPTION_KEY: ${HERO_MFA_ENCRYPTION_KEY:-}
      HERO_MFA_ENCRYPTION_KEY_PREVIOUS: ${HERO_MFA_ENCRYPTION_KEY_PREVIOUS:-}
      HERO_IDENTITY_OWNER_USER_ID: ${HERO_IDENTITY_OWNER_USER_ID:-hero-owner}
      HERO_OWNER_EMAIL: ${HERO_OWNER_EMAIL:-}
      HERO_OWNER_DISPLAY_NAME: ${HERO_OWNER_DISPLAY_NAME:-Hero Owner}
      HERO_OWNER_PASSWORD: ${HERO_OWNER_PASSWORD:-}
      HERO_OWNER_MFA_SECRET: ${HERO_OWNER_MFA_SECRET:-}
      HERO_OWNER_MFA_SECRET_REF: ${HERO_OWNER_MFA_SECRET_REF:-env:HERO_OWNER_MFA_SECRET}
      HERO_BACKOFFICE_USER: ${HERO_BACKOFFICE_USER:-}
      HERO_BACKOFFICE_PASSWORD: ${HERO_BACKOFFICE_PASSWORD:-}
      HERO_POSTGRES_URL: ${HERO_POSTGRES_URL:-}
      HERO_POSTGRES_PASSWORD: ${HERO_POSTGRES_PASSWORD:-}
      HERO_REQUIRE_POSTGRES: ${HERO_REQUIRE_POSTGRES:-false}
      HERO_NOTION_ENABLED: ${HERO_NOTION_ENABLED:-false}
      HERO_NOTION_API_TOKEN: ${HERO_NOTION_API_TOKEN:-}
      HERO_NOTION_API_VERSION: ${HERO_NOTION_API_VERSION:-2026-03-11}
      HERO_NOTION_REQUEST_TIMEOUT_MS: ${HERO_NOTION_REQUEST_TIMEOUT_MS:-30000}
      HERO_NOTION_PARENT_PAGE_ID: ${HERO_NOTION_PARENT_PAGE_ID:-}
      HERO_NOTION_ALLOWED_CLASSIFICATIONS: ${HERO_NOTION_ALLOWED_CLASSIFICATIONS:-internal}
      HERO_NOTION_BULK_WRITE_APPROVED: ${HERO_NOTION_BULK_WRITE_APPROVED:-false}
      HERO_NOTION_WORKSPACE_WRITE_APPROVED: ${HERO_NOTION_WORKSPACE_WRITE_APPROVED:-false}
      HERO_NOTION_BATCH_WRITE_APPROVED: ${HERO_NOTION_BATCH_WRITE_APPROVED:-false}
      HERO_NOTION_PRODUCT_SYSTEM_WRITE_APPROVED: ${HERO_NOTION_PRODUCT_SYSTEM_WRITE_APPROVED:-false}
      HERO_NOTION_AUTO_SYNC_INTERVAL_SECONDS: ${HERO_NOTION_AUTO_SYNC_INTERVAL_SECONDS:-300}
      HERO_ENABLE_REAL_PROVIDERS: ${HERO_ENABLE_REAL_PROVIDERS:-false}
      HERO_NODE_AGENT_ENABLED: ${HERO_NODE_AGENT_ENABLED:-false}
      HERO_OPENAI_API_KEY: ${HERO_OPENAI_API_KEY:-}
      HERO_ANTHROPIC_API_KEY: ${HERO_ANTHROPIC_API_KEY:-}
      HERO_GOOGLE_API_KEY: ${HERO_GOOGLE_API_KEY:-}
      HERO_CURSOR_API_KEY: ${HERO_CURSOR_API_KEY:-}
      HERO_OPENAI_COMPATIBLE_API_KEY: ${HERO_OPENAI_COMPATIBLE_API_KEY:-}
      HERO_EXTERNAL_SPEND_AUTHORIZATION_ACTIVE: ${HERO_EXTERNAL_SPEND_AUTHORIZATION_ACTIVE:-false}
      HERO_EXTERNAL_SPEND_AUTHORIZATION_ID: ${HERO_EXTERNAL_SPEND_AUTHORIZATION_ID:-}
      HERO_EXTERNAL_SPEND_PROJECT_ID: ${HERO_EXTERNAL_SPEND_PROJECT_ID:-}
      HERO_EXTERNAL_SPEND_PROJECT_SCOPE: ${HERO_EXTERNAL_SPEND_PROJECT_SCOPE:-single-project}
      HERO_EXTERNAL_SPEND_ENVIRONMENT: ${HERO_EXTERNAL_SPEND_ENVIRONMENT:-}
      HERO_EXTERNAL_SPEND_STEP_ID: ${HERO_EXTERNAL_SPEND_STEP_ID:-}
      HERO_EXTERNAL_SPEND_DOCUMENT_VERSION: ${HERO_EXTERNAL_SPEND_DOCUMENT_VERSION:-}
      HERO_EXTERNAL_SPEND_PROVIDER_ID: ${HERO_EXTERNAL_SPEND_PROVIDER_ID:-}
      HERO_EXTERNAL_SPEND_MODEL_IDS: ${HERO_EXTERNAL_SPEND_MODEL_IDS:-}
      HERO_EXTERNAL_SPEND_ROLE_IDS: ${HERO_EXTERNAL_SPEND_ROLE_IDS:-}
      HERO_EXTERNAL_SPEND_CAPABILITIES: ${HERO_EXTERNAL_SPEND_CAPABILITIES:-}
      HERO_EXTERNAL_SPEND_MAX_COST_UNITS: ${HERO_EXTERNAL_SPEND_MAX_COST_UNITS:-}
      HERO_EXTERNAL_SPEND_EXPIRES_AT: ${HERO_EXTERNAL_SPEND_EXPIRES_AT:-}
      HERO_EXTERNAL_SPEND_GLOBAL_STOP: ${HERO_EXTERNAL_SPEND_GLOBAL_STOP:-false}
    ports:
      - "${HERO_BIND_ADDRESS:-127.0.0.1}:${HERO_EXPOSE_PORT:-43100}:3100"
    volumes:
      - hero-data:/var/lib/hero
    networks:
      - hero-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  hero-postgres:
    profiles: ["postgres"]
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hero
      POSTGRES_USER: hero
      POSTGRES_PASSWORD: ${HERO_POSTGRES_PASSWORD:-}
    volumes:
      - hero-postgres-data:/var/lib/postgresql/data
    networks:
      - hero-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero -d hero"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Hero Test-only Caddy authentication sidecar
  backoffice-proxy:
    profiles: ["test-caddy-auth"]
    image: caddy@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    # The official Caddy binary carries cap_net_bind_service. Keep only
    # that capability in the bounding set so exec is permitted.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/hero/caddy-test/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    networks:
      hero-private:
        aliases:
          - hero-test-caddy-auth
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  notion-auto-sync:
    profiles: ["notion-auto-sync"]
    image: ${HERO_IMAGE:-hero-control-plane:local}
    init: true
    restart: unless-stopped
    command: ["node", "tools/sync-notion-product-system.mjs", "--watch"]
    environment:
      HERO_POSTGRES_URL: ${HERO_POSTGRES_URL:-}
      HERO_POSTGRES_PASSWORD: ${HERO_POSTGRES_PASSWORD:-}
      HERO_REQUIRE_POSTGRES: ${HERO_REQUIRE_POSTGRES:-true}
      HERO_NOTION_ENABLED: ${HERO_NOTION_ENABLED:-false}
      HERO_NOTION_API_TOKEN: ${HERO_NOTION_API_TOKEN:-}
      HERO_NOTION_API_VERSION: ${HERO_NOTION_API_VERSION:-2026-03-11}
      HERO_NOTION_REQUEST_TIMEOUT_MS: ${HERO_NOTION_REQUEST_TIMEOUT_MS:-30000}
      HERO_NOTION_PARENT_PAGE_ID: ${HERO_NOTION_PARENT_PAGE_ID:-}
      HERO_NOTION_ALLOWED_CLASSIFICATIONS: ${HERO_NOTION_ALLOWED_CLASSIFICATIONS:-internal}
      HERO_NOTION_PRODUCT_SYSTEM_WRITE_APPROVED: ${HERO_NOTION_PRODUCT_SYSTEM_WRITE_APPROVED:-false}
      HERO_NOTION_AUTO_SYNC_INTERVAL_SECONDS: ${HERO_NOTION_AUTO_SYNC_INTERVAL_SECONDS:-300}
      HERO_SOURCE_COMMIT: ${HERO_SOURCE_COMMIT:-workspace-uncommitted}
    networks:
      - hero-private
    depends_on:
      hero-postgres:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  hero-data:
  hero-postgres-data:

networks:
  hero-private:
    driver: bridge
